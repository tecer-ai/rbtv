  test-sleep:
    # INERT TEST PROFILE (D52) -- the ONLY non-production profile here. It exists so the
    # spawn/ticker path can be exercised end-to-end WITHOUT a paid, side-effecting LLM
    # worker on the box that holds the vault. NO LLM. NO network. No side effects outside
    # its own workdir. Named for the in-process probe fixture it mirrors
    # (server/ticker/probes/lib.js) so probe/live parity is obvious -- D23: reuse the term,
    # never mint an alias. Repointed to the seat shape by r-seats-only-architecture: it homes
    # under .rbtv/goals and runs in the shared seat cage like every other profile.
    #
    # DURATION (60s) is load-bearing, not arbitrary. A `sleep` writes no stdout and reports
    # no completion, so the ticker's Enforce phase is the ONLY thing that records its exit:
    # the crash sweep sees the unit go inactive and writes a synthetic `completion`
    # (status: failed, exit=0 -- D23's "crash-swept agent", D18(4) uniform exit path) plus
    # jobs_log.status=failed. But the crash sweep only scans running/launching rows, and
    # silence drives the stall ladder: warn at 12 ticks, halt at 24 (10s cadence). A row
    # marked `stalled` LEAVES the swept set, so its exit would never be recorded at all.
    # 60s exits at ~tick 7 -- swept well inside the 12-tick warn rung, while still leaving
    # a comfortable window to observe the worker alive across a terminal close (CON-1).
    exec:
      argv: ["sleep", "60"]
      prompt: stdin        # sleep ignores stdin; the server still writes the prompt and closes it (EOF guard)
    effort: { inert: true }   # sleep has no dial; stated so a resolver-backed dispatch is not refused (G-270)
    session_ref: { source: cwd-implicit }   # sleep has no session concept; the workdir IS the ref
    toolset_ceiling: read-only   # a sleep needs no tools; the narrowest tier is the honest ceiling
    workdir_root: .rbtv/goals
    # override pending ruling — was per-profile before r-seats-only-architecture (a test profile
    # at the 2G/6h default would let a stuck fixture hold seat-scale resources).
    caps: { memory_max: "64M", cpu_quota: "10%", runtime_max: "5m", tasks_max: 16 }

# ─────────────────────────────────────────────────────────────────────────────
# tools:  — task 7.70. DAEMON-ONLY root key (server/index.js:40 DAEMON_ONLY_ROOT_KEYS);
# the daemon strips it into {dataRoot}/.runtime-config/ itself, so it belongs in this
# committed file. Read at boot only (loadMergedConfig, no fs.watch) — reaches the daemon
# through the integrator's restart.
#
# `fire-tool` resolves argv from config.tools[<args.tool>] and runs it VERBATIM
# (ticker.js runToolLikeExec, caps:{} sandbox:{}).
#
# WHAT IS PER-RUN, EXACTLY — TWO THINGS SINCE TASK 7.559, and the difference between them
# is the difference between an ungoverned value and a governed one:
#   · `args.workdir` — the cwd. Per-run and UNVALIDATED on this path, deliberately (a
#     fire-tool row's workdir is legitimately a repo or a state root, so the `.rbtv/goals/`
#     containment applied to start-workflow would refuse the live edge-runner and self-heal
#     rows — `heart-store.js` records why). This predates 7.559 and is untouched by it; it
#     is filed as its own row (7.562). ⚠ It is a real residual exposure, not a design.
#   · an `args_allowlist` KEY — an argv operand, admitted by IDENTITY against a list this
#     file declares. Only entries that declare one have any per-run operand at all.
#
# ⚠ AN ENTRY THAT DECLARES NO `args_allowlist` IS STILL FULLY FROZEN. Its argv is passed to
# exec byte-identical, on the same code path as before 7.559. Frozen is the DEFAULT and it
# is carried by the shape, not by a promise: the templating branch is unreachable without a
# declared list, and an entry that templates a value WITHOUT declaring one is refused (fail
# closed) rather than exec'ing the literal token `{{goal}}`.
#
# DESIGN CALL — ONE ENTRY PER TARGET, and the twin entries are NOT redundant.
# The integrator correctly noted that `workdir` is per-run, so one entry could in
# principle serve two targets. It cannot serve THESE two: each detector's target lives in
# its ARGV (--session for the room, --package for the heartbeat), not in its cwd. Making
# the target implicit in workdir would mean the target of a recovery job could be changed
# by whoever enqueues it. With one entry per target, re-pointing a job at the LIVE room or
# the LIVE heartbeat requires editing this file and an integrator-owned daemon restart —
# announced, auditable, and impossible to do by accident from an enqueue.
#
# ⚠ WHAT 7.559 PRESERVES AND WHAT IT RELAXES — stated plainly, because a reader who gets
# this wrong builds the next entry wrong. PRESERVED, exactly: WHICH targets are reachable
# is still fixed at config-write time, and still costs a reviewed diff plus an
# integrator-owned restart — because extending an allowlist IS that same config edit, in
# this same file. RELAXED, narrowly: an enqueuer who could previously influence only the
# working directory can now also SELECT which of N pre-approved targets a job acts on,
# where N is a number a human wrote in a reviewed diff. For `edge-runner` today N is 1.
# The one-entry-per-target rule above is therefore RELIEVED ONLY where a list exists: an
# allowlisted key replaces "one static entry per target" with "one entry, one reviewed list"
# — it never lets an enqueue name a target nobody approved.
#
# ═════════════════════════════════════════════════════════════════════════════
# ⚠  READ BEFORE ADDING AN ENTRY BELOW — THE DAEMON DOES NOT CONTAIN THESE.
#
# A `fire-tool` exec runs with NO bubblewrap namespace and NO cgroup caps. This is not
# a gap in the config, it is what the code does: `runToolLikeExec` (server/ticker/
# ticker.js) passes literal `caps: {}` and `sandbox: {}`, and ticker.js never calls
# `buildBwrapArgv` at all. Verified in the daemon's own journal — the `systemd-run` line
# for a fired tool carries no MemoryMax, no TasksMax, no bwrap.
#
# So, unlike every SEAT (whose containment task 7.30 proves at the kernel), a tool here
# can read and write anywhere this daemon's user can — the vault, the credential surface
# at .rbtv/config/.env, the heart store, ~/.ssh — for as long and as large as it likes.
#
# EVERY ENTRY MUST THEREFORE CONTAIN ITSELF. The script you point `argv` at must:
#   1. cap its own address space (RLIMIT_AS) and its own wall clock;
#   2. hold a single-instance lock, so a slow run cannot be started twice;
#   3. write only under paths it derives itself;
#   4. ⚑ RESTORE THE ORIGINAL LIMITS IN ANY CHILD IT EXECS. RLIMIT_AS is INHERITED: a
#      detector that caps itself at 256 MB and then launches a sensor or a recovery agent
#      hands that 256 MB to the process it is resurrecting. This is the clause a later
#      author drops silently, and the failure it causes appears in the recovered process,
#      not in the detector — hours away from the change that caused it.
#
# ── AND IF THE ENTRY DECLARES AN `args_allowlist` (task 7.559), FIVE MORE RULES ──────────
#   5. THE LIST LIVES HERE AND NOWHERE ELSE. Never in a job registration's `args_schema`,
#      never in a runtime settings file, never in an env var. `register-job` is reachable by
#      any enrolled AGENT token, so a list living there is extensible by the agents it
#      bounds — no restart, no reviewed diff, boundary moved. This is the entire security
#      condition of the ruling that permits per-run arguments at all.
#   6. LIST LITERAL VALUES, NEVER PATTERNS. There is no regex, prefix or glob support and
#      none is wanted: the admissible set must be enumerable and must have been written by a
#      human. If you find yourself wanting a pattern, you want a value you have not approved.
#   7. THE OPERAND IS STILL AN OPERAND, NEVER THE PROGRAM. `argv[0]` may not be a
#      placeholder (refused in `heart/argv-template.js`), and a placeholder must be a WHOLE
#      token — `--goal={{goal}}` is refused, so a value can never be welded onto a flag.
#   8. EVERY MEMBER IS A LIFETIME COMMITMENT, exactly like an argv path: the boot check walks
#      allowlist values too, so a member naming a folder that is gone logs one error per boot
#      forever (naming BOTH the stale path and the `key` that declared it). Retiring the target
#      means deleting the line — same act, same restart.
#   9. THE SHAPE IS A MAPPING OF KEY → LIST, and nothing else:
#
#          args_allowlist:
#            <key>:
#              - <permitted literal value>
#
#      NOT a scalar (`args_allowlist: goal`) and NOT a bare list (`args_allowlist: [ … ]`). YAML
#      accepts both of those happily, so the daemon refuses them at FIRE as a shape error and
#      records the execution `failed` — the entry then fires NEVER, on every cadence, until the
#      shape is fixed. ⚠ IT USED TO BE MUCH WORSE: a scalar raised a TypeError out of the expander,
#      and `tick()` has a `finally` with no `catch`, so ONE typo on this line abandoned enforce,
#      broadcast and the whole tick record EVERY TICK until a human noticed (task 7.577; the
#      §2 review of 7.559 measured it). It is guarded now, and the guard is a REFUSAL rather than a
#      rescue — so get the shape right rather than trusting the refusal to be loud enough.
#
# A COMMENT IS NOT A WALL. It is here because the wall is missing and the absence needs to
# be visible at the moment someone adds an entry. The daemon-side fix — enforcing caps on
# the fire-tool path — is filed as issues.md G-30 for m2 (a containment-semantics change,
# deliberately not made overnight without a shadow window).
# ⚠ THE ALLOWLIST DOES NOT NARROW THAT GAP ONE BYTE. It bounds WHO CAN STEER a fired tool;
# it does nothing about WHAT A FIRED TOOL CAN DO. Rules 1-4 above bind every entry equally,
# allowlisted or not.
# ═════════════════════════════════════════════════════════════════════════════
tools:

  # ── task 7.71 (r-selfheal-job) — dead-room detection + recovery ────────────
  # LIVE target: the run's own room. Fires only when the room is ALREADY dead.
  # Recovery goes through the KIT, not the daemon — the room is a tmux SESSION, not a
  # daemon-spawned seat; the daemon's tmux-room target is deliberately off
  # (RBTV_IGNITE_TMUX_ROOM unset); and r-cutover-gated bars the run's own control loop
  # from adopting an un-shadowed path. Reasoning in selfheal-room.py's docstring.
  selfheal-room:
    argv:
      - /usr/bin/python3
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/jobs/selfheal-room.py
      - --session
      - build-core-daemon-mvp
      # G-50: a room is alive when the session EXISTS *and* contains what it exists to contain.
      # Without this, a recovery that creates the session and then fails to boot its agent
      # leaves a room that exists and is EMPTY — and the detector no-ops on it forever.
      - --require-cmd
      - claude
      - --require-cmd
      - opencode
      - --require-cmd
      - codex
      - --budget-s
      - "60"
      - --
      # NOT bare `coordinate launch` — that argv CANNOT recover a dead room and, worse, would
      # guess. `launch` contains zero `new-session` calls (it only opens a window in an EXISTING
      # session), and it resolves its target from COORD_LAUNCH_TARGET or TMUX_PANE, neither of
      # which a daemon-fired exec has; with both unset tmux resolves the empty target to the
      # MOST RECENT session — measured answering `build-core-daemon-mvp`, the LIVE room.
      # recover-room.py creates the session, resolves the target EXPLICITLY, re-reads it to prove
      # it is the room asked for, fails loud rather than falling through, and verifies the seat's
      # harness BY PID before calling it recovered.
      - /usr/bin/python3
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/jobs/recover-room.py
      - --session
      - build-core-daemon-mvp
      # ⚠ THIS ENTRY DELIBERATELY NAMES NO RUN — task 7.188 (design M4-49), discharging 7.106
      # criterion 3's remainder. It carried `--package .../runs/run-1` for a run CLOSED
      # 2026-07-27, so a fire would have booted the recovery seat into a closed run's package
      # while the job's own status kept reading healthy. Swapping in run-3 reproduces that defect
      # at the next run close; naming the GOAL and deriving the lease at fire time does not. Same
      # remedy and same shape as the `selfheal-watch` entry that used to sit below (deleted
      # with `watch.py`, task 7.35) — resolved through
      # coord.derive_lease (7.607: liveness computed from live evidence — the goal's room and
      # verified seat processes; no stored register), which REFUSES on unreadable or ambiguous
      # evidence rather than guessing.
      - --goal
      - /home/henri/ht-wkdir/second-brain/.rbtv/goals/build-core-daemon-mvp
      - --seat
      - recovery-agent
      - --coord
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/team-kit/coord.py

