# ═════════════════════════════════════════════════════════════════════════════
# workflows: — the launcher a `start-workflow` queue row fires (task C5E)
# ═════════════════════════════════════════════════════════════════════════════
#
# A DAEMON-ONLY SECTION, like `tools:` and `ticker:` above: `server/index.js` strips it before
# `spawn/config.js` sees it (DAEMON_ONLY_ROOT_KEYS), and the heart store holds it as the catalogue
# `enqueue-job` validates a `start-workflow` row against — a row naming a workflow absent from here
# is REFUSED at the door, and re-checked at fire.
#
# ⚠ EVERY ENTRY HERE IS A TEMPLATE, AND THE ROW FILLS ITS OPERANDS. `{{workflow}}`, `{{entry-seat}}`,
# `{{goal}}` and `{{workdir}}` are expanded from the firing row's own args by
# `server/heart/argv-template.js`, which is what lets ONE generic launcher serve every workflow
# instead of one static entry per workflow. That module's header carries the whole injection
# argument — array in / array out, whole-token only, one pass, closed key set — and it is NOT
# restated here. Two consequences bind an author of this section:
#   · argv[0] MAY NEVER BE A PLACEHOLDER. A row may fill an operand, never CHOOSE THE PROGRAM;
#     the expander refuses it in one place rather than trusting every config author.
#   · A TOKEN IS A PLACEHOLDER OR A LITERAL, NEVER A MIX. `--flag={{workdir}}` is refused as
#     malformed, so a value can never be concatenated onto a flag it did not arrive with.
#
# ⚠ NAME THE INTERPRETER AND NAME THE REPO FILE — never a bare command, never a symlink. A
# start-workflow exec inherits the systemd --user manager's PATH, which does not carry
