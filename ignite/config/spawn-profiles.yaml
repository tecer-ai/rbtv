bind:
  host: 127.0.0.1        # the UNCONDITIONAL loopback listener (p5-2, network-posture-spec Design 1). MUST stay a
                         # loopback address — the daemon ALSO binds this node's tailnet address automatically
                         # (resolved at runtime from tailscaled). A non-loopback/non-tailnet host is refused at
                         # startup by the fail-closed bind guard (E_BIND_FORBIDDEN); there is NO override.
  port: 7431             # build-time default; changing it is a config edit + restart

# Daemon-only namespace (stripped before spawn/config.js sees it, like ticker/tools/workflows).
# The tailnet-bind readiness retry budget (network-posture-spec Design 2, rule 2). The daemon binds
# loopback first, then attempts this node's tailnet address with this bounded retry; on exhaustion it
# runs loopback-only with a standing warning (surfaced by `ignite status`) and NEVER widens to 0.0.0.0.
network:
  tailnet_bind_retries: 3       # attempts to resolve+bind the tailnet address before degrading to loopback-only
  tailnet_bind_retry_ms: 1000   # delay between attempts (ms). Env: RBTV_IGNITE_TAILNET_RETRIES / _RETRY_MS (probes)

auth:
  senders_file: /etc/rbtv-ignite/senders.yaml   # named-sender registry (D15 shape: sender-id, kind, token-hash, enabled); 0600, outside the repo
  # ⚑ STARTUP GATE (p4-1, spawn-profiles-spec.md Design 4): the daemon REFUSES TO START when this
  # file is missing, empty, group/world-readable, malformed, or declares no senders. Deploying it is
  # an OWNER-EXECUTED install step — see config/senders.example.yaml for the seed + the procedure.
  # Override the path (e.g. for probes) with RBTV_IGNITE_SENDERS_FILE via the unit's EnvironmentFile;
  # never by writing an instance path here (D26(3)).
  # Internal gateway<->server-core auth is the internal-api contract (p1-3) — NOT configured here:
  # it is a per-boot secret minted by the composition root, never a configured value.

spawn:
  data_root: /var/lib/rbtv-ignite   # the PER-MACHINE state root (batch-08 item 10 boundary — ignite/CLAUDE.md
                                    # § State layout): heart.db, logs/, prompts/, exits/, ticker.log,
                                    # feed.jsonl live under here. Live deploys override via RBTV_IGNITE_DATA_ROOT
                                    # (the user unit's StateDirectory= path); this seed is the system-service shape.
  carrier: systemd                  # required (D48): containment is non-negotiable. A worker runs under
                                    # systemd-run --user with its profile caps/sandbox, or it refuses to start.
  kill_grace_seconds: 10            # SIGTERM -> grace -> SIGKILL

default_workdir_root: /path/set-at-setup   # REQUIRED (D22): the workdir every spawn falls back to when the
                                           # caller supplies none. Owner-fixed at setup (e.g. the owner's
                                           # workspace root); the seed ships this PLACEHOLDER only -- never
                                           # a hardcoded instance path (D9 relocatability).

# ═══════════════════════════════════════════════════════════════════════════════════════════════
# r-seats-only-architecture (owner, 2026-08-06) — THE SEAT CAGE IS THE ONE SANDBOX SHAPE.
# The flat worker cage (scratch-dir RW, nothing mounted) is RETIRED, and with it the flat
# `.rbtv/sessions/` launch path and the conductor-lane `cli-*` profile family (the daemon's
# sub-agent lane retires; delegation is seat-side). Every daemon spawn is a SEAT, homed under
# `.rbtv/goals`, launched inside the parameterized seat cage below.
#
# The config contract the resolver reads is exactly four surfaces (r-seats-only-architecture):
#   cage:      ONE shared cage template — the 7.11 seat cage, now every profile's sandbox
#   caps:      ONE shared resource-caps default block — per-profile overrides only by ruling
#   toolsets:  the CLOSED tool-rights enum — a dispatch narrows, never widens
#   launch-specs: ONE spec per harness+model; each carries ONLY exec / headed (where the
#              harness has a TUI) / effort / session_ref / toolset_ceiling / workdir_root.
#              Effort, launch home and tool rights are PER-DISPATCH parameters, never identity.
#
# ⚑ EFFORT IS A NUMERIC RUNG, 1..N, AND EVERY PROFILE DECLARES ITS OWN LADDER (owner ruling
# `d-0811lp-effort-numeric-per-profile`, 2026-08-11). `effort.rungs` is an ORDERED list of the
# strings THIS harness accepts — rung 1 lowest reasoning, rung N highest — and `effort.argv` is the
# fragment that carries the chosen one ({effort}). A rung outside 1..N is refused NAMING the range.
# A harness with no dial declares `effort: { inert: true }`: it ACCEPTS any rung and reports
# `effortInert` (G-270), so an absent dial is stated rather than silently dropped. Absent effort is
# the harness default.
#   ⚠ This REPLACED the four-level abstract vocabulary (low|medium|high|max + a `values:` map) that
#   7.42 shipped. That scheme could only be as wide as its narrowest member: claude's fifth rung
#   `xhigh` was unspellable and codex's `max` was silently collapsed onto `high`. The ladders below
#   are each harness's OWN, measured — never a translation of a shared one.
# ═══════════════════════════════════════════════════════════════════════════════════════════════

# ── THE SHARED SEAT CAGE (r-seats-only-architecture (1)) ───────────────────────────────────────
# Absorbed from the retired 7.11 `claude-seat` profile: the SeatBinds template below is that
# profile's VERBATIM, plus the one new line class part (5) of the ruling adds (harnessCreds).
# Per-dispatch parameters supply the paths ({goalDir}/{seatDir}) and the grants — `{runDir}` is
# RETIRED (7.607 E2b, design-lock item 8: the package IS the goal folder).
#
# GRANT CLASSES (owner ruling "1a", 2026-08-06 — the instrument set a service seat is promised).
# Every one is declared in the seat's OWN `seat.md` frontmatter, which the cage ro-binds, so an
# occupant can never widen its own walls; an absent key composes the line to NOTHING.
#   read-root: true    ro-bind the workspace root (the master role's read-everything mandate)
#   bus-write: true    RW the coordination dir of EVERY goal's OPEN run (the coordination CLI)
#   goals-write: true  RW the RUN FOLDER of every goal's OPEN run, EXCEPT the seat's own run,
#                      with each granted run's sessions.csv carved back read-only (the seat
#                      materializer: seats/<seat>/seat.md + the taskforce.csv append). Creates
#                      nothing: a run folder that is not there is not opened, so materializing a
#                      NEW run package stays outside this grant.
#   local-bin: true    ro-bind the invoking user's ~/.local/bin (the user-local CLIs)
#   tmux-socket: true  ro-bind tmux's socket dir ($TMUX_TMPDIR|/tmp)/tmux-<uid>, punched back
#                      through bwrap's `--tmpfs /tmp` (owner-directed 2026-08-07). Without it
#                      the coordination CLI can LOG a message but its WAKE leg cannot reach any
#                      pane — the recipient is never nudged. READ-ONLY is sufficient AND is the
#                      bound: connect(2) on a unix socket is not refused by a read-only mount,
#                      so the seat drives the rooms that exist and can mint or destroy none.
#   keep-instruction-files: true
#                      NOT a mount either — it RELAXES the ancestor mask
#                      (r-seat-context-cut-at-launch-folder). Every seat spawn masks the harness
#                      artifacts on the path BETWEEN the workspace root and the launch folder
#                      (CLAUDE.md/AGENTS.md over /dev/null, .claude/.codex/.opencode/.agents/
#                      .kimi under a tmpfs) plus the auto-memory dir; this key keeps the path-up
#                      INSTRUCTION FILES while the config dirs and auto-memory stay masked — the
#                      CHANNEL seat's posture, ruled as a policy so a second seat needing it
#                      declares it rather than being special-cased by path. The set and the walk
#                      live in ONE place: `server/spawn/cage.js` composeAncestorMasks.
#                      ⚠ CLAUDE.md/AGENTS.md INSIDE `.rbtv/goals/` are NEVER masked for any seat
#                      (the goal + run folders must keep injecting), and the LAUNCH FOLDER'S OWN
#                      artifacts are never masked — a seat may carry its own `.claude/`.
#   gateway-env: true  NOT a mount — passes IGNITE_GATEWAY_ADDR into the session's environment
#                      (a `--setenv`, composed beside these binds; no token, ever — the sender
#                      token reaches a CLI from the workspace's gitignored
#                      `.rbtv/config/sender-token.env` — its OWN file since 7.566, because the
#                      `.env` beside it holds third-party secrets and is MASKED in every seat
#                      cage — read there by `cli/lib/config.js` resolveToken)
#   rw-paths:          a BLOCK LIST of workspace-relative paths bound READ-WRITE (owner ruling
#                      "a", 2026-08-06). The generic answer to an in-workspace CLI that must
#                      rewrite its own state under the `read-root` floor — the motivating case
#                      is gtools refreshing an OAuth token into its credentials dir.
#                        rw-paths:
#                          - 3-resources/tools/google/credentials
#                      VALIDATED PER ENTRY, refuse-loudly: a bad entry is SKIPPED and LOGGED,
#                      never guessed at and never fatal to the spawn. An entry is refused when
#                      it is empty or ABSOLUTE (the vocabulary is workspace-relative only), when
#                      it ESCAPES the workspace root after `..` normalization, or when it
#                      OVERLAPS `<ws>/.rbtv/goals` in either direction — every sessions.csv and
#                      every seat.md lives under that subtree, so the identity/ground-truth
#                      surfaces stay unwritable and the seat.md ro-carve keeps winning. A
#                      nonexistent path is skipped; nothing is ever created.
cage:
  NoNewPrivileges: true
  # Retained as the declarative source of the harness-local advisory write-restraint config
  # (the second belt). The KERNEL set is SeatBinds below — it REPLACES the flat workdir opening
  # in bwrap, it does not add to it.
  ReadWritePaths: ["{workdir}"]
  # ── THE FENCE (D3, 2026-08-19). ORDER IS LOAD-BEARING — each line deliberately shadows the
  # one above it, and cage.js emits them in exactly this sequence. Later wins.
  #
  # Allow-list: (1) the goal's worktree branches, RW; (2) the goal folder, read, and goal-folder
  # artifacts, write; (3) the seat's own folder, RW, except seat.md; (4) rbtv/ and
  # <ws>/.rbtv/mirror, read; (5) coordination ledgers, WRITABLE; (6) env/secret files, simply
  # not present (private-scope.js — do not pierce).
  #
  # A file-level ro-bind of a RECORD is gone: records are what seats must write, and denying
  # them is the EROFS class. A file-level ro-bind of a WALL-CONTROL SURFACE stays: `seat.md`
  # (it is the permission record the NEXT session's cage is derived from) — not forgery
  # prevention; it is the fence holding its own posts. D3 item 3 names it explicitly. Record
  # forgery is a NON-goal (D3). Its former sibling, `coordination/permission-edits.csv` (the
  # audit of cage widenings and the mechanism that applied them), is GONE ([T2-R12, T1-R9],
  # 2026-08-24): the grant store is deleted, owner auth is an answer to a live ask.
  #
  # ⚠ W5 (owner ruling D-1, 2026-08-13) EXTENDS THAT ORDER WITH TWO TIERS BELOW THIS LIST, and
  # both are load-bearing in the same way. After every line here, spawn.js appends
  # `cage.js#composeAncestorMasks`, which emits: (1) the ancestor/auto-memory/PRIVATE-SCOPE MASKS,
  # then (2) the PIERCE re-binds — the openings above that name a private entry, re-emitted so
  # they survive their own mask. GRANTS → MASKS → PIERCES. A pierce written up here instead would
  # simply be re-covered by its mask; a mask written above a grant would be shadowed by it.
  # ⚠ AND THE `ro-bind:{grant:readRoot}` LINE MUST STAY FIRST for a second, now UNIVERSAL reason
  # (adv C56): the `ro-mask:{goalDir}/seats` line below is what makes PEER SEAT FOLDERS ABSENT, and
  # it only shadows the read-everything floor because that floor is emitted before it. Move the
  # read-root line down and every read-root seat reads every other seat's folder.
  # `probe-private-scope.js` legs 1-7 and 9 are the arms that hold this paragraph.
  SeatBinds:
    # READ-EVERYTHING grant (r-seats-only-architecture; the master role's read-everything
    # mandate): the whole workspace READ-ONLY, GRANT-GATED — produced only for a seat whose
    # seat.md declares `read-root: true` (ro-bound below; its writers are the materializer
    # and the master, never the occupant). No grant -> line skipped -> the vault stays
    # ABSENT for ordinary seats, exactly as the pre-registered probes assert.
    # FIRST deliberately: every later line layers its narrower opening over this ro floor.
    - "ro-bind:{grant:readRoot}"
    # D3 items 2+5 in ONE line — the goal folder RW. Replaces the five ledger bind-try lines,
    # planning/, settings-requests/, coordination/, {grant:goalWrite}, and the
    # sessions.csv / state.csv ro carves. (D3: record forgery is a non-goal; ledgers are
    # writable. Fewer knobs is the point — each deleted line was an EROFS repair.)
    - "bind:{goalDir}"
    # ⚑ PEER SEAT FOLDERS: ABSENT, writes REFUSE (D48). Was `--tmpfs` (writable, evaporates —
    # fake-success). `ro-mask` ro-binds an empty source so mkdir/write fail EROFS.
    - "ro-mask:{goalDir}/seats"
    # W1 — the seat's own folder, READ-WRITE (D3 item 3).
    - "bind:{seatDir}"
    # RO carve-IN inside W1. seat.md is the permission record the NEXT session's cage is
    # derived from — a wall-control surface, not a record. D3 item 3 names this exception.
    # Order is the mechanism: AFTER the {seatDir} bind, last-bind-wins.
    - "ro-bind:{seatDir}/seat.md"
    # D3 item 4 — rbtv repo root and <ws>/.rbtv/mirror, READ. Grant-resolved from spawn.js
    # (this module's location / the seat's workspaceRoot), never a hardcoded install path
    # (#d-no-hardcoded-paths). ro-bind-try: a missing mirror must cost the mirror, never spawn.
    - "ro-bind-try:{grant:rbtvRoot}"
    - "ro-bind-try:{grant:rbtvMirror}"
    # BUS-WRITE grant (owner ruling "1a"): the coordination dir of every EXECUTING goal,
    # READ-WRITE, one opening per grant. Must come AFTER the read-root ro floor.
    - "bind:{grant:busWrite}"
    # W3 (adv, C34) — the WALL-CONTROL SURFACE carve over `permission-edits.csv` (the leader's
    # audited widenings AND the mechanism that applied them) is DELETED here ([T2-R12, T1-R9],
    # 2026-08-24): the grant store is gone, owner auth is an answer to a live ask, and the file
    # is no longer a runtime surface — no bind line, RO or RW, names it any more.
    # GOALS-WRITE grant: the GOAL FOLDER of every EXECUTING goal other than this seat's own.
    # The own goal is already RW via bind:{goalDir} above. The goalsWriteGroundTruth carve
    # is DELETED (D3: record forgery is a non-goal).
    - "bind:{grant:goalsWrite}"
    # W2 — the seat's own worktree(s), one opening per grant (task 7.38). No grants -> no
    # openings; another seat's worktree is never a grant of this seat.
    - "bind:{grant:worktree}"
    # W3 — that repo's git plumbing, so a worktree COMMIT succeeds. The `.git` ROOT stays
    # read-only, which is not incidental: it kernel-blocks fetch/push/gc from inside the cage,
    # making 7.38's "no per-seat remote pushes" true below the review layer. Accepted cost:
    # `git gc`/`pack-refs` fail in-cage — seats commit, they do not maintain.
    - "ro-bind:{grant:repoGit}"
    - "bind:{grant:repoGit}/objects"
    - "bind:{grant:repoGit}/refs"
    - "bind:{grant:repoGit}/logs"
    - "bind:{grant:worktreeGitDir}"
    # NEW LINE CLASS (r-seats-only-architecture (5)): read-only mounts for the harness
    # credential/config paths a seat is entitled to dispatch with. Grant-gated exactly like
    # worktrees — no grants -> no openings; a seat never sees credentials it was not granted.
    - "ro-bind:{grant:harnessCreds}"
    # LOCAL-BIN grant (owner ruling "1a"): the invoking user's ~/.local/bin, READ-ONLY. Beside
    # harnessCreds because it is the same kind of opening — a path under the HOME tmpfs bwrap
    # lays down before this stack, punched back through it. Nothing later covers it.
    - "ro-bind:{grant:localBin}"
    # TMUX-SOCKET grant (owner-directed 2026-08-07): tmux's socket DIRECTORY, READ-ONLY — the
    # same kind of opening again, this time punched back through bwrap's `--tmpfs /tmp`, which
    # is what hid the socket from every caged seat alike and killed the coordination CLI's wake
    # leg. READ-ONLY is the whole grant and it is sufficient: `connect(2)` on a unix socket is
    # not refused by a read-only mount, so send-keys/capture-pane/display-message work while
    # creating or deleting a socket does not. Placement is free — the path is outside the
    # workspace root, so no line in this stack covers it.
    - "ro-bind:{grant:tmuxSocketDir}"
    # RW-PATHS grant (owner ruling "a"): the seat's declared in-workspace read-write paths,
    # one opening per entry. LAST deliberately, and the placement is the mechanism: every
    # entry lies inside the workspace root, which `ro-bind:{grant:readRoot}` covers read-only
    # at the top of this stack — so an opening placed anywhere above that floor would be
    # re-covered by it and compose to nothing observable. Nothing below it needs to shadow it
    # back: the two lines that could (the seat.md ro-carve and the run-folder tmpfs erasures)
    # both live under `.rbtv/goals`, and the resolver REFUSES any entry overlapping that
    # subtree — so the carves win by never meeting an rw-paths entry, not by ordering.
    - "bind:{grant:rwPath}"
    # W6 · CLI-WRITE-ROOTS grant: the write roots declared by the CLIs this seat's exposed SKILLS
    # route to (`write-roots` in exposure.csv, resolved seat -> skill -> CLI -> root by
    # `team-kit/materialize-seats.py` and baked into seat.md as `cli-write-roots:`). Beside its
    # `rwPath` sibling and for the identical reason: every entry lies inside the workspace root,
    # which `ro-bind:{grant:readRoot}` covers read-only at the top of this stack, so an opening
    # placed above that floor composes to nothing. It carries its own grant key rather than reusing
    # `rwPath` so the cage spec and the spawn log keep the provenance visible.
    # ⚠ The private-scope masks are appended AFTER this whole stack, so a deny always wins over one
    # of these grants — a CLI-derived root is never a pierce.
    - "bind:{grant:cliWriteRoot}"
  # ⚑ ABSENT / UNWRITABLE BY CONSTRUCTION (D3, WORKER cages): peer seat folders even for READ
  # (ro-mask, writes refuse — D48), other seats' worktrees, main repo WORKING trees outside
  # the seat's own worktree, vault 2-areas/ and other repos that are not goals/, .rbtv/heart/,
  # env/secret files (private-scope.js). seat.md stays RO (a wall-control surface).
  # MasterBinds below is the D49 exception for `*-master` roles.
  #
  # D49 — TRULY-EVERYTHING cage for ALL caged master roles (`goal-master`, `channel-master`;
  # `console-master` is unsandboxed and never reaches this stack). Whole workspace RW. No
  # peer-seats mask, no seat.md carve, rbtv repo RW. Private-scope
  # masks still append last — secrets stay read-denied (mask wins over this stack).
  MasterBinds:
    - "bind:{grant:readRoot}"
    - "bind:{goalDir}"
    - "bind:{seatDir}"
    - "bind-try:{grant:rbtvRoot}"
    - "bind-try:{grant:rbtvMirror}"
    - "bind:{grant:busWrite}"
    - "bind:{grant:goalsWrite}"
    - "bind:{grant:worktree}"
    - "ro-bind:{grant:repoGit}"
    - "bind:{grant:repoGit}/objects"
    - "bind:{grant:repoGit}/refs"
    - "bind:{grant:repoGit}/logs"
    - "bind:{grant:worktreeGitDir}"
    - "ro-bind:{grant:harnessCreds}"
    - "ro-bind:{grant:localBin}"
    - "ro-bind:{grant:tmuxSocketDir}"
    - "bind:{grant:rwPath}"
    - "bind:{grant:cliWriteRoot}"

# ── THE GLOBAL CAPS DEFAULT (r-seats-only-architecture (2)) ────────────────────────────────────
# One default block; a profile-level `caps:` carries ONLY the keys it overrides, and only by
# ruling. Values carried unchanged from the uniform pre-doctrine per-profile blocks.
caps:
  memory_max: "2G"
  cpu_quota: "150%"
  runtime_max: "6h"
  tasks_max: 512

# ── TOOLSETS — the CLOSED tool-rights enum (r-seats-only-architecture (2)) ─────────────────────
# Tool rights are a per-dispatch parameter: a dispatch selects a tier AT OR BELOW its profile's
# `toolset_ceiling`, and a dispatch (or a child — part (5): the enum bounds what a seat may pass
# its children) may only ever NARROW, never widen. Where a harness has a real allowlist
# mechanism it is carried into the tier; where none exists the tier is DECLARATIVE — the
# resolver enforces what it can, and nothing is invented that the harness cannot honor.
toolsets:
  read-only:
    # No write tools. No harness in the retired profile set exposed a verified read-only
    # allowlist flag, so this tier is declarative on every harness.
    {}
  git-write:
    # The retired claude-sonnet-tools allowlist shape, carried verbatim for the one harness
    # with a real per-tool allowlist mechanism.
    claude:
      argv: ["--allowedTools", "Bash(git *),Write"]   # comma-joined ONE arg (POC)
  full:
    # Unrestricted within the cage — the cage, not the harness, is the wall.
    {}

launch-specs:
  # ═════════════════════════════════════════════════════════════════════════════════════════════
  # KEYED BY (HARNESS, MODEL) — THERE IS NO NAME LAYER (owner ruling `#d-abolish-profile-names`,
  # 2026-08-12). This block used to be `profiles:`, a flat map keyed by an arbitrary NAME, and that
  # name was the only unit a caller could select. Both are abolished: a seat's CAST — the
  # (harness, model, effort) written into its bindings sheet
  # (`.rbtv/config/modules/{module}/{component}/bindings/{code}.json`) — is the absolute source of
  # truth for what it runs, and the daemon looks the mechanics up BY THAT PAIR at spawn time. No
  # caller anywhere in ignite may select a launch spec; an uncast seat is a NAMED REFUSAL.
  #
  # ⚠ THE KEY IS THE AUTHORITY AND `exec.argv` MUST AGREE WITH IT. `launch-profiles/profiles.js#
  # validateSpecKey` refuses at config LOAD when a spec filed under `claude/claude-opus-5` runs
  # `--model claude-haiku-4-5` — the key decides what a cast resolves to, so a disagreement is a
  # launch running a model nobody asked for while every record says otherwise.
  #
  # ONE SPEC PER HARNESS+MODEL (r-seats-only-architecture (2)) — nothing else is identity.
  # The set is the owner-ruled roster (2026-08-06, live at console): claude fable/opus/sonnet/
  # haiku, codex gpt-5.5 + gpt-5.6 family, opencode glm/deepseek/fugu/gemini/grok plus
  # opencode-hosted kimi-for-coding models (k2.7/k3). The kimi harness is retired.
  # profiles' MEASURED values, carried unchanged.
  #
  # exec argvs carry the caged posture (claude bypassPermissions, codex danger-full-access,
  # opencode run --auto): under r-seats-only-architecture the bwrap seat cage is ALWAYS the
  # boundary — the portable/caged halves retire with the flat lane, and a host with no cage
  # refuses to spawn rather than running wall-less (the E_NO_PORTABLE_HALF direction, kept).
  #
  # ⚠ EFFORT IS TRANSLATED, NEVER BAKED, AND NEVER SILENTLY DROPPED (G-270): every spec
  # carries a translation table or an explicit `inert: true`. A harness whose dial does not
  # exist says so.
  # ═════════════════════════════════════════════════════════════════════════════════════════════

  claude:
    # ── claude (4 models) ────────────────────────────────────────────────────────────────────────
    # `stream-json` + `--verbose` is the shape 18 real jobs ran on. Headed: seats are headed by
    # construction where the owner joins; no prompt carriage — a seat is driven by its DESCRIPTOR
    # and by the room, never by argv text (R7, D86).
    #
    # ⚑ `headed.tui` PINS THE PROFILE'S MODEL (owner ruling core-build decisions.md#d-s21-headed-tui-pins-model,
    # 2026-08-10): a profile named `claude-opus` that runs the harness default in one lane and opus in
    # the other is a profile whose name means two things. The pin is `--model`, the same flag and the
    # same value the `exec`/`resume` templates carry. Blast radius INCLUDES the daemon-headed lane
    # (tmux-pane seats), ruled knowingly.
    #
    # ⚑ exec/resume ARE A PAIR (r-chat-chain-resumes-session, owner 2026-08-07). The exec ASSIGNS
    # the harness session id (`--session-id {session_ref}`, so the rbtv session id and the harness
    # session id are ONE value and `session_ref: { source: assigned }` needs to read nothing back);
    # a chained turn then launches the resume argv with the PREDECESSOR's ref and a prompt carrying
    # only the owner's new message(s). Measured on claude 2.1.224: `-p --resume <id>` keeps the same
    # session id and its context (cache_creation 8843 -> 92 tokens on the second turn).
    # ponytail: the two argvs are spelled out in full and must be kept in step by hand — a
    # `--settings` change applied to one only would run two different postures on one profile. A
    # shared-core/two-templates config shape is the upgrade path if that ever bites.

    claude-fable-5:
      exec:
        argv: ["claude", "-p", "--model", "claude-fable-5",
               "--session-id", "{session_ref}",
               "--output-format", "stream-json", "--verbose",
               "--permission-mode", "bypassPermissions",
               "--settings", "/home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/config/chat-session-settings.json"]
        prompt: stdin
      resume:
        argv: ["claude", "-p", "--resume", "{session_ref}",
               "--model", "claude-fable-5",
               "--output-format", "stream-json", "--verbose",
               "--permission-mode", "bypassPermissions",
               "--settings", "/home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/config/chat-session-settings.json"]
        prompt: stdin
      headed:
