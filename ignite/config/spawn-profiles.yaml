  #
  # ⚠ A FAILED SCAFFOLD LEAVES THE PARTIAL GOAL STANDING — ruled, no unwind
  # (`d-owner-q10-launcher-0808` clause 3). The daemon cannot prove it alone created that
  # directory, so the partial state is DISCLOSED in the request's refusal record (`goal-dir`,
  # `goal-exists`, `scaffolded`) instead of deleted. Expect orphan goal directories after a failed
  # fire; that is the ruled behaviour.
  #
  # ⚠ LANDED IS NOT LIVE, AND THE GAP IS THIS FILE'S OWN. It is BOOT-READ, so the entry below
  # activates at the NEXT daemon restart and not before.
  #
  # ⚠ THE FIVE NEW FLAGS BELOW ARE WHAT MAKES THE GOAL BORN READY TO EXECUTE. `scaffold-and-queue`
  # completes the goal folder's WORKING SURFACES through the ruled name `scaffold-seats` instead of
