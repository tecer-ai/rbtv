bind:
  host: 127.0.0.1        # the UNCONDITIONAL loopback listener (p5-2, network-posture-spec Design 1). MUST stay a
                         # loopback address — the daemon ALSO binds this node's tailnet address automatically
                         # (resolved at runtime from tailscaled). A non-loopback/non-tailnet host is refused at
                         # startup by the fail-closed bind guard (E_BIND_FORBIDDEN); there is NO override.
  port: 7431             # build-time default; changing it is a config edit + restart

# Daemon-only namespace (stripped before spawn/config.js sees it, like ticker/tools/workflows).
# The tailnet-bind readiness retry budget (network-posture-spec Design 2, rule 2). The daemon binds
# loopback first, then attempts this node's tailnet address with this bounded retry; on exhaustion it
# runs loopback-only with a standing warning (surfaced by `ignite status`) and NEVER widens to 0.0.0.0.
network:
  tailnet_bind_retries: 3       # attempts to resolve+bind the tailnet address before degrading to loopback-only
  tailnet_bind_retry_ms: 1000   # delay between attempts (ms). Env: RBTV_IGNITE_TAILNET_RETRIES / _RETRY_MS (probes)

auth:
  senders_file: /etc/rbtv-ignite/senders.yaml   # named-sender registry (D15 shape: sender-id, kind, token-hash, enabled); 0600, outside the repo
  # ⚑ STARTUP GATE (p4-1, spawn-profiles-spec.md Design 4): the daemon REFUSES TO START when this
  # file is missing, empty, group/world-readable, malformed, or declares no senders. Deploying it is
  # an OWNER-EXECUTED install step — see config/senders.example.yaml for the seed + the procedure.
  # Override the path (e.g. for probes) with RBTV_IGNITE_SENDERS_FILE via the unit's EnvironmentFile;
  # never by writing an instance path here (D26(3)).
  # Internal gateway<->server-core auth is the internal-api contract (p1-3) — NOT configured here:
  # it is a per-boot secret minted by the composition root, never a configured value.

spawn:
  data_root: /var/lib/rbtv-ignite   # the PER-MACHINE state root (batch-08 item 10 boundary — ignite/CLAUDE.md
                                    # § State layout): heart.db, logs/, prompts/, exits/, ticker.log,
                                    # feed.jsonl live under here. Live deploys override via RBTV_IGNITE_DATA_ROOT
                                    # (the user unit's StateDirectory= path); this seed is the system-service shape.
  carrier: systemd                  # required (D48): containment is non-negotiable. A worker runs under
                                    # systemd-run --user with its profile caps/sandbox, or it refuses to start.
  kill_grace_seconds: 10            # SIGTERM -> grace -> SIGKILL

default_workdir_root: /path/set-at-setup   # REQUIRED (D22): the workdir every spawn falls back to when the
                                           # caller supplies none. Owner-fixed at setup (e.g. the owner's
                                           # workspace root); the seed ships this PLACEHOLDER only -- never
                                           # a hardcoded instance path (D9 relocatability).

# ═══════════════════════════════════════════════════════════════════════════════════════════════
# r-seats-only-architecture (owner, 2026-08-06) — THE SEAT CAGE IS THE ONE SANDBOX SHAPE.
# The flat worker cage (scratch-dir RW, nothing mounted) is RETIRED, and with it the flat
# `.rbtv/sessions/` launch path and the conductor-lane `cli-*` profile family (the daemon's
# sub-agent lane retires; delegation is seat-side). Every daemon spawn is a SEAT, homed under
# `.rbtv/goals`, launched inside the parameterized seat cage below.
#
# The config contract the resolver reads is exactly four surfaces (r-seats-only-architecture):
#   cage:      ONE shared cage template — the 7.11 seat cage, now every profile's sandbox
#   caps:      ONE shared resource-caps default block — per-profile overrides only by ruling
#   toolsets:  the CLOSED tool-rights enum — a dispatch narrows, never widens
#   profiles:  ONE profile per harness+model; each carries ONLY exec / headed (where the
#              harness has a TUI) / effort / session_ref / toolset_ceiling / workdir_root.
#              Effort, launch home and tool rights are PER-DISPATCH parameters, never identity.
# ═══════════════════════════════════════════════════════════════════════════════════════════════

# ── THE SHARED SEAT CAGE (r-seats-only-architecture (1)) ───────────────────────────────────────
# Absorbed from the retired 7.11 `claude-seat` profile: the SeatBinds template below is that
# profile's VERBATIM, plus the one new line class part (5) of the ruling adds (harnessCreds).
# Per-dispatch parameters supply the paths ({goalDir}/{runDir}/{seatDir}) and the grants.
cage:
  NoNewPrivileges: true
  # Retained as the declarative source of the harness-local advisory write-restraint config
  # (the second belt). The KERNEL set is SeatBinds below — it REPLACES the flat workdir opening
  # in bwrap, it does not add to it.
  ReadWritePaths: ["{workdir}"]
  # ── THE WRITABLE SET (r-711-write-bounds, verbatim: own seat folder + own worktree + that
  # repo's git plumbing, and NOTHING else). ORDER IS LOAD-BEARING — each line deliberately
  # shadows the one above it, and cage.js emits them in exactly this sequence.
  SeatBinds:
    # READ-EVERYTHING grant (r-seats-only-architecture; the master role's read-everything
    # mandate): the whole workspace READ-ONLY, GRANT-GATED — produced only for a seat whose
    # seat.md declares `read-root: true` (ro-bound below; its writers are the materializer
    # and the master, never the occupant). No grant -> line skipped -> the vault stays
    # ABSENT for ordinary seats, exactly as the pre-registered probes assert.
    # FIRST deliberately: every later line layers its narrower opening over this ro floor.
    - "ro-bind:{grant:readRoot}"
    # READ the goal's own record — decisions.md, issues.md, doubts.md.
    - "ro-bind:{goalDir}"
    # Every OTHER run: ABSENT. Not denied — never bound.
    - "tmpfs:{goalDir}/runs"
    # READ this run — sessions.csv, state.csv, run CLAUDE.md, conduct.md.
    - "ro-bind:{runDir}"
    # ⚑ PEER SEAT FOLDERS: ABSENT. This is "never read another seat's folder" moved out of
    # the conduct manual and into the kernel — the one rule in this run that was, until now,
    # enforced entirely by every agent choosing to obey it.
    - "tmpfs:{runDir}/seats"
    # W1 — the seat's own folder, READ-WRITE: launch home, sessions/{session-id}/ artifacts,
    # and the box-① work-in-progress memory the KG membership test's fourth prong names
    # (memory*, conventions.md).
    - "bind:{seatDir}"
    # RO carve-IN inside W1. seat.md is the identity + permissions surface; its writers are
    # goal-materialize and the staffer, never the sitting occupant. The cage is fixed at spawn,
    # so editing it could not widen THIS session's walls — but it would rewrite the permission
    # record the NEXT session's cage and the gate's permission-attach step derive from.
    - "ro-bind:{seatDir}/seat.md"
    # S1 INTERIM, RETIRES AT TASK 7.57 — leader-ruled, recorded, deliberately narrow. Under
    # the pre-bound set a caged seat could not write the kit's coordination files, and the
    # target model routes that through the gateway (7.57/7.59, unbuilt). Nothing wider: the
    # goal-root ledgers and vault task files stay OUT, routed through uncaged stewards.
    - "bind:{runDir}/coordination"
    # W2 — the seat's own worktree(s), one opening per grant (task 7.38). No grants -> no
    # openings; another seat's worktree is never a grant of this seat.
    - "bind:{grant:worktree}"
    # W3 — that repo's git plumbing, so a worktree COMMIT succeeds. The `.git` ROOT stays
    # read-only, which is not incidental: it kernel-blocks fetch/push/gc from inside the cage,
    # making 7.38's "no per-seat remote pushes" true below the review layer. Accepted cost:
    # `git gc`/`pack-refs` fail in-cage — seats commit, they do not maintain.
    - "ro-bind:{grant:repoGit}"
    - "bind:{grant:repoGit}/objects"
    - "bind:{grant:repoGit}/refs"
    - "bind:{grant:repoGit}/logs"
    - "bind:{grant:worktreeGitDir}"
    # NEW LINE CLASS (r-seats-only-architecture (5)): read-only mounts for the harness
    # credential/config paths a seat is entitled to dispatch with. Grant-gated exactly like
    # worktrees — no grants -> no openings; a seat never sees credentials it was not granted.
    - "ro-bind:{grant:harnessCreds}"
  # ⚑ ABSENT BY CONSTRUCTION, each one a pre-registered probe: the run folder's files for
  # WRITE (the identity gate's ground truth — refused at compose time by cage.js, not merely
  # unlisted here), peer seat folders even for READ, other seats' worktrees, the goal
  # integration worktree, main repo WORKING trees, the vault root, .rbtv/heart/,
  # .rbtv/sessions/ (the retired flat launch path), and the rbtv source checkout.

# ── THE GLOBAL CAPS DEFAULT (r-seats-only-architecture (2)) ────────────────────────────────────
# One default block; a profile-level `caps:` carries ONLY the keys it overrides, and only by
# ruling. Values carried unchanged from the uniform pre-doctrine per-profile blocks.
caps:
  memory_max: "2G"
  cpu_quota: "150%"
  runtime_max: "6h"
  tasks_max: 512

# ── TOOLSETS — the CLOSED tool-rights enum (r-seats-only-architecture (2)) ─────────────────────
# Tool rights are a per-dispatch parameter: a dispatch selects a tier AT OR BELOW its profile's
# `toolset_ceiling`, and a dispatch (or a child — part (5): the enum bounds what a seat may pass
# its children) may only ever NARROW, never widen. Where a harness has a real allowlist
# mechanism it is carried into the tier; where none exists the tier is DECLARATIVE — the
# resolver enforces what it can, and nothing is invented that the harness cannot honor.
toolsets:
  read-only:
    # No write tools. No harness in the retired profile set exposed a verified read-only
    # allowlist flag, so this tier is declarative on every harness.
    {}
  git-write:
    # The retired claude-sonnet-tools allowlist shape, carried verbatim for the one harness
    # with a real per-tool allowlist mechanism.
    claude:
      argv: ["--allowedTools", "Bash(git *),Write"]   # comma-joined ONE arg (POC)
  full:
    # Unrestricted within the cage — the cage, not the harness, is the wall.
    {}

profiles:
  # ═════════════════════════════════════════════════════════════════════════════════════════════
  # ONE PROFILE PER HARNESS+MODEL (r-seats-only-architecture (2)) — nothing else is identity.
  # The set is the owner-ruled roster (2026-08-06, live at console): claude fable/opus/sonnet/
  # haiku, codex gpt-5.5 only, kimi, opencode glm-5.2/deepseek-flash/deepseek-pro/fugu/
  # fugu-ultra/gemini-flash/gemini-pro. Effort translation tables are the retired cli-*
  # profiles' MEASURED values, carried unchanged.
  #
  # exec argvs carry the caged posture (claude bypassPermissions, codex danger-full-access,
  # opencode/kimi bare): under r-seats-only-architecture the bwrap seat cage is ALWAYS the
  # boundary — the portable/caged halves retire with the flat lane, and a host with no cage
  # refuses to spawn rather than running wall-less (the E_NO_PORTABLE_HALF direction, kept).
  #
  # ⚠ EFFORT IS TRANSLATED, NEVER BAKED, AND NEVER SILENTLY DROPPED (G-270): every profile
  # carries a translation table or an explicit `inert: true`. A harness whose dial does not
  # exist says so.
  # ═════════════════════════════════════════════════════════════════════════════════════════════

  # ── claude (4 models) ────────────────────────────────────────────────────────────────────────
  # `stream-json` + `--verbose` + session_ref stdout-json/session_id is the shape 18 real jobs
  # ran on. Headed: seats are headed by construction where the owner joins; no prompt carriage —
  # a seat is driven by its DESCRIPTOR and by the room, never by argv text (R7, D86).

  claude-fable:
    exec:
      argv: ["claude", "-p", "--model", "claude-fable-5",
             "--output-format", "stream-json", "--verbose",
             "--permission-mode", "bypassPermissions",
             "--settings", "/home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/config/chat-session-settings.json"]
      prompt: stdin
    headed:
      tui: { argv: ["claude"] }
    effort:
      dialect: effort
      values: { low: low, medium: medium, high: high, max: max }
      argv: ["--effort", "{effort}"]
    session_ref: { source: stdout-json, field: session_id }
    toolset_ceiling: full
    workdir_root: .rbtv/goals

  claude-opus:
    # The alias is pinned explicitly (`claude --help` documents `--model` accepting a
    # latest-model alias): a profile that pins no model records a mapping true on one machine
    # at one moment.
    exec:
      argv: ["claude", "-p", "--model", "opus",
             "--output-format", "stream-json", "--verbose",
             "--permission-mode", "bypassPermissions",
             "--settings", "/home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/config/worker-session-settings.json"]
      prompt: stdin
    headed:
      tui: { argv: ["claude"] }
    effort:
      dialect: effort
      values: { low: low, medium: medium, high: high, max: max }
      argv: ["--effort", "{effort}"]
    session_ref: { source: stdout-json, field: session_id }
    toolset_ceiling: full
    workdir_root: .rbtv/goals

  claude-sonnet:
    exec:
      argv: ["claude", "-p", "--model", "sonnet",
             "--output-format", "stream-json", "--verbose",
             "--permission-mode", "bypassPermissions",
             "--settings", "/home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/config/chat-session-settings.json"]
      prompt: stdin
    headed:
      tui: { argv: ["claude"] }
    effort:
      dialect: effort
      values: { low: low, medium: medium, high: high, max: max }
      argv: ["--effort", "{effort}"]
    session_ref: { source: stdout-json, field: session_id }
    toolset_ceiling: full
    workdir_root: .rbtv/goals

  claude-haiku:
    # ⚑ `effort: { inert: true }` IS A MEASUREMENT, NOT A SHORTCUT. The claude-code-cli manifest
    # gives haiku `reasoning_modes.depths: []` / `invocation: none` — Haiku is single-mode and
    # has no effort dial. An inert table makes the resolver ACCEPT a caller's level and report
    # it back as `effortInert: true`; omitting the block would refuse the pair (G-270).
    exec:
      argv: ["claude", "-p", "--model", "haiku",
             "--output-format", "stream-json", "--verbose",
             "--permission-mode", "bypassPermissions",
             "--settings", "/home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/config/worker-session-settings.json"]
      prompt: stdin
    headed:
      tui: { argv: ["claude"] }
    effort: { inert: true }
    session_ref: { source: stdout-json, field: session_id }
    toolset_ceiling: full
    workdir_root: .rbtv/goals

  # ── codex (1 model) ──────────────────────────────────────────────────────────────────────────
  # codex POLICY-blocks .git writes under workspace-write regardless of config, so the exec runs
  # `--sandbox danger-full-access` — codex's own sandbox is OFF and containment is the seat cage
  # (the D61 lineage). Model PINNED (`-m`): an unpinned profile records a mapping true on
  # one machine at one moment. Effort: codex spells the dial `thinking` and its manifest declares
  # depths [low, medium, high] — THREE, not four; the abstract `max` maps to `high`, a LOSSY but
  # honest collapse the resolver reports rather than silently drops. No `headed:` — the retired
  # set never declared a codex TUI and none is verified here.

  codex-gpt-5-5:
    exec:
      argv: ["codex", "exec", "--cd", "{workdir}", "-m", "gpt-5.5",
             "--sandbox", "danger-full-access", "-c", "approval_policy=never", "--json"]
      prompt: stdin        # codex hangs without stdin EOF from a non-TTY; the server closes stdin after writing
    effort:
      dialect: thinking
      values: { low: low, medium: medium, high: high, max: high }
      argv: ["-c", "model_reasoning_effort={effort}"]
    session_ref: { source: stdout-json-event, event: thread.started, field: thread_id }
    toolset_ceiling: full
    workdir_root: .rbtv/goals

  # ── kimi (1 model) ───────────────────────────────────────────────────────────────────────────
  # `kimi --help` declares no sandbox and no permission mode (measured) — containment is entirely
  # the seat cage's. `--yolo` deliberately ABSENT: `--quiet` implies `--print`, which already
  # auto-approves tool calls for the invocation. ⚠ THE MODEL PIN IS THE MANIFEST'S, VERIFIED
  # AGAINST THIS BOX, NOT READ OFF IT: a machine whose kimi config does not carry this id refuses
  # loudly at dispatch rather than silently running another model. Effort: depths [no-think,
  # think] — a BINARY dial, not a ladder; the four abstract levels collapse two-and-two, lossy
  # and stated rather than implied.

  kimi:
    exec:
      argv: ["kimi", "--quiet", "-m", "kimi-code/kimi-for-coding", "--work-dir", "{workdir}"]
      prompt: stdin
    effort:
      dialect: thinking-toggle
      values: { low: "--no-thinking", medium: "--no-thinking", high: "--thinking", max: "--thinking" }
      argv: ["{effort}"]
    session_ref: { source: cwd-implicit }
    toolset_ceiling: full
    workdir_root: .rbtv/goals

  # ── opencode (7 models) ──────────────────────────────────────────────────────────────────────
  # DEC-2 / POC Finding 3: opencode has NO sandbox of its own (it touched the live vault
  # unprompted) — containment is entirely the seat cage's. Effort is INERT on all seven and that
  # is MEASURED, not assumed: a 2026-07-09 probe found opencode forwards `--variant` to the
  # provider without validating it, so there is no honored ladder. session_ref cwd-implicit:
  # opencode resumes per-cwd; the seat folder IS the ref. Headed: bare TUI argv, no prompt
  # carriage (D86 — carriage declaration awaits the real-terminal `--prompt` verification; a
  # `{prompt}` slot would make the prompt mandatory and break the bare owner-driven entry path).
  # 8h caps overrides: carried from the pre-doctrine per-profile blocks, pending ruling.
  # Roster owner-ruled 2026-08-06; model IDs verified live on this box via `opencode models`
  # (Google, DeepSeek, Sakana AI, Z.AI all authenticated per `opencode auth list`).

  opencode-glm-5-2:
    exec:
      argv: ["opencode", "run", "-m", "zai-coding-plan/glm-5.2"]
      prompt: stdin
    headed:
      tui: { argv: ["opencode"] }
    effort: { inert: true }
    session_ref: { source: cwd-implicit }
    toolset_ceiling: full
    workdir_root: .rbtv/goals
    caps: { runtime_max: "8h" }   # override pending ruling — was per-profile before r-seats-only-architecture

  opencode-deepseek-flash:
    exec:
      argv: ["opencode", "run", "-m", "deepseek/deepseek-v4-flash"]
      prompt: stdin
    headed:
      tui: { argv: ["opencode"] }
    effort: { inert: true }
    session_ref: { source: cwd-implicit }
    toolset_ceiling: full
    workdir_root: .rbtv/goals
    caps: { runtime_max: "8h" }   # override pending ruling — was per-profile before r-seats-only-architecture

  opencode-deepseek-pro:
    exec:
      argv: ["opencode", "run", "-m", "deepseek/deepseek-v4-pro"]
      prompt: stdin
    headed:
      tui: { argv: ["opencode"] }
    effort: { inert: true }
    session_ref: { source: cwd-implicit }
    toolset_ceiling: full
    workdir_root: .rbtv/goals
    caps: { runtime_max: "8h" }   # override pending ruling — was per-profile before r-seats-only-architecture

  opencode-fugu:
    exec:
      argv: ["opencode", "run", "-m", "sakana/fugu"]
      prompt: stdin
    headed:
      tui: { argv: ["opencode"] }
    effort: { inert: true }
    session_ref: { source: cwd-implicit }
    toolset_ceiling: full
    workdir_root: .rbtv/goals
    caps: { runtime_max: "8h" }   # override pending ruling — was per-profile before r-seats-only-architecture

  opencode-fugu-ultra:
    exec:
      argv: ["opencode", "run", "-m", "sakana/fugu-ultra"]
      prompt: stdin
    headed:
      tui: { argv: ["opencode"] }
    effort: { inert: true }
    session_ref: { source: cwd-implicit }
    toolset_ceiling: full
    workdir_root: .rbtv/goals
    caps: { runtime_max: "8h" }   # override pending ruling — was per-profile before r-seats-only-architecture

  opencode-gemini-flash:
    # `gemini-flash-latest` is a FLOATING alias — the model identity floats with Google's latest; owner chose it knowingly.
    exec:
      argv: ["opencode", "run", "-m", "google/gemini-flash-latest"]
      prompt: stdin
    headed:
      tui: { argv: ["opencode"] }
    effort: { inert: true }
    session_ref: { source: cwd-implicit }
    toolset_ceiling: full
    workdir_root: .rbtv/goals
    caps: { runtime_max: "8h" }   # override pending ruling — was per-profile before r-seats-only-architecture

  opencode-gemini-pro:
    # PREVIEW model ID — Google may retire `gemini-3.1-pro-preview`; expect a re-pin when it graduates or disappears.
    exec:
      argv: ["opencode", "run", "-m", "google/gemini-3.1-pro-preview"]
      prompt: stdin
    headed:
      tui: { argv: ["opencode"] }
    effort: { inert: true }
    session_ref: { source: cwd-implicit }
    toolset_ceiling: full
    workdir_root: .rbtv/goals
    caps: { runtime_max: "8h" }   # override pending ruling — was per-profile before r-seats-only-architecture

  test-sleep:
    # INERT TEST PROFILE (D52) -- the ONLY non-production profile here. It exists so the
    # spawn/ticker path can be exercised end-to-end WITHOUT a paid, side-effecting LLM
    # worker on the box that holds the vault. NO LLM. NO network. No side effects outside
    # its own workdir. Named for the in-process probe fixture it mirrors
    # (server/ticker/probes/lib.js) so probe/live parity is obvious -- D23: reuse the term,
    # never mint an alias. Repointed to the seat shape by r-seats-only-architecture: it homes
    # under .rbtv/goals and runs in the shared seat cage like every other profile.
    #
    # DURATION (60s) is load-bearing, not arbitrary. A `sleep` writes no stdout and reports
    # no completion, so the ticker's Enforce phase is the ONLY thing that records its exit:
    # the crash sweep sees the unit go inactive and writes a synthetic `completion`
    # (status: failed, exit=0 -- D23's "crash-swept agent", D18(4) uniform exit path) plus
    # jobs_log.status=failed. But the crash sweep only scans running/launching rows, and
    # silence drives the stall ladder: warn at 12 ticks, halt at 24 (10s cadence). A row
    # marked `stalled` LEAVES the swept set, so its exit would never be recorded at all.
    # 60s exits at ~tick 7 -- swept well inside the 12-tick warn rung, while still leaving
    # a comfortable window to observe the worker alive across a terminal close (CON-1).
    exec:
      argv: ["sleep", "60"]
      prompt: stdin        # sleep ignores stdin; the server still writes the prompt and closes it (EOF guard)
    effort: { inert: true }   # sleep has no dial; stated so a resolver-backed dispatch is not refused (G-270)
    session_ref: { source: cwd-implicit }   # sleep has no session concept; the workdir IS the ref
    toolset_ceiling: read-only   # a sleep needs no tools; the narrowest tier is the honest ceiling
    workdir_root: .rbtv/goals
    # override pending ruling — was per-profile before r-seats-only-architecture (a test profile
    # at the 2G/6h default would let a stuck fixture hold seat-scale resources).
    caps: { memory_max: "64M", cpu_quota: "10%", runtime_max: "5m", tasks_max: 16 }

# ─────────────────────────────────────────────────────────────────────────────
# tools:  — task 7.70. DAEMON-ONLY root key (server/index.js:40 DAEMON_ONLY_ROOT_KEYS);
# the daemon strips it into {dataRoot}/.runtime-config/ itself, so it belongs in this
# committed file. Read at boot only (loadMergedConfig, no fs.watch) — reaches the daemon
# through the integrator's restart.
#
# `fire-tool` resolves argv from config.tools[<args.tool>] and runs it VERBATIM
# (ticker.js runToolLikeExec, caps:{} sandbox:{}). Only `args.workdir` is per-run.
#
# DESIGN CALL — ONE ENTRY PER TARGET, and the twin entries are NOT redundant.
# The integrator correctly noted that `workdir` is per-run, so one entry could in
# principle serve two targets. It cannot serve THESE two: each detector's target lives in
# its ARGV (--session for the room, --package for the heartbeat), not in its cwd. Making
# the target implicit in workdir would mean the target of a recovery job could be changed
# by whoever enqueues it. With one entry per target, re-pointing a job at the LIVE room or
# the LIVE heartbeat requires editing this file and an integrator-owned daemon restart —
# announced, auditable, and impossible to do by accident from an enqueue.
#
# ═════════════════════════════════════════════════════════════════════════════
# ⚠  READ BEFORE ADDING AN ENTRY BELOW — THE DAEMON DOES NOT CONTAIN THESE.
#
# A `fire-tool` exec runs with NO bubblewrap namespace and NO cgroup caps. This is not
# a gap in the config, it is what the code does: `runToolLikeExec` (server/ticker/
# ticker.js) passes literal `caps: {}` and `sandbox: {}`, and ticker.js never calls
# `buildBwrapArgv` at all. Verified in the daemon's own journal — the `systemd-run` line
# for a fired tool carries no MemoryMax, no TasksMax, no bwrap.
#
# So, unlike every SEAT (whose containment task 7.30 proves at the kernel), a tool here
# can read and write anywhere this daemon's user can — the vault, ~/ht-wkdir/.env/, the
# heart store, ~/.ssh — for as long and as large as it likes.
#
# EVERY ENTRY MUST THEREFORE CONTAIN ITSELF. The script you point `argv` at must:
#   1. cap its own address space (RLIMIT_AS) and its own wall clock;
#   2. hold a single-instance lock, so a slow run cannot be started twice;
#   3. write only under paths it derives itself;
#   4. ⚑ RESTORE THE ORIGINAL LIMITS IN ANY CHILD IT EXECS. RLIMIT_AS is INHERITED: a
#      detector that caps itself at 256 MB and then launches a sensor or a recovery agent
#      hands that 256 MB to the process it is resurrecting. This is the clause a later
#      author drops silently, and the failure it causes appears in the recovered process,
#      not in the detector — hours away from the change that caused it.
#
# A COMMENT IS NOT A WALL. It is here because the wall is missing and the absence needs to
# be visible at the moment someone adds an entry. The daemon-side fix — enforcing caps on
# the fire-tool path — is filed as issues.md G-30 for m2 (a containment-semantics change,
# deliberately not made overnight without a shadow window).
# ═════════════════════════════════════════════════════════════════════════════
tools:

  # ── task 7.71 (r-selfheal-job) — dead-room detection + recovery ────────────
  # LIVE target: the run's own room. Fires only when the room is ALREADY dead.
  # Recovery goes through the KIT, not the daemon — the room is a tmux SESSION, not a
  # daemon-spawned seat; the daemon's tmux-room target is deliberately off
  # (RBTV_IGNITE_TMUX_ROOM unset); and r-cutover-gated bars the run's own control loop
  # from adopting an un-shadowed path. Reasoning in selfheal-room.py's docstring.
  selfheal-room:
    argv:
      - /usr/bin/python3
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/jobs/selfheal-room.py
      - --session
      - build-core-daemon-mvp
      # G-50: a room is alive when the session EXISTS *and* contains what it exists to contain.
      # Without this, a recovery that creates the session and then fails to boot its agent
      # leaves a room that exists and is EMPTY — and the detector no-ops on it forever.
      - --require-cmd
      - claude
      - --require-cmd
      - opencode
      - --require-cmd
      - codex
      - --budget-s
      - "600"
      - --
      # NOT bare `coordinate launch` — that argv CANNOT recover a dead room and, worse, would
      # guess. `launch` contains zero `new-session` calls (it only opens a window in an EXISTING
      # session), and it resolves its target from COORD_LAUNCH_TARGET or TMUX_PANE, neither of
      # which a daemon-fired exec has; with both unset tmux resolves the empty target to the
      # MOST RECENT session — measured answering `build-core-daemon-mvp`, the LIVE room.
      # recover-room.py creates the session, resolves the target EXPLICITLY, re-reads it to prove
      # it is the room asked for, fails loud rather than falling through, and verifies the seat's
      # harness BY PID before calling it recovered.
      - /usr/bin/python3
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/jobs/recover-room.py
      - --session
      - build-core-daemon-mvp
      # ⚠ THIS ENTRY DELIBERATELY NAMES NO RUN — task 7.188 (design M4-49), discharging 7.106
      # criterion 3's remainder. It carried `--package .../runs/run-1` for a run CLOSED
      # 2026-07-27, so a fire would have booted the recovery seat into a closed run's package
      # while the job's own status kept reading healthy. Swapping in run-3 reproduces that defect
      # at the next run close; naming the GOAL and asking runs.csv does not. Same remedy and same
      # shape as the live `selfheal-watch` entry below — resolved through coord.resolve_live_run
      # (R10), which REFUSES rather than guesses on zero or two open rows.
      - --goal
      - /home/henri/ht-wkdir/second-brain/.rbtv/goals/build-core-daemon-mvp
      - --seat
      - recovery-agent
      - --coord
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/team-kit/coord.py

  # THROWAWAY twin: a scratch tmux session, recovered by re-creating that session.
  # This is the entry the staged-failure probe uses. Killing `tw-room-probe` costs the
  # run nothing; killing `build-core-daemon-mvp` would kill the run the job protects.
  selfheal-room-throwaway:
    argv:
      - /usr/bin/python3
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/jobs/selfheal-room.py
      - --session
      - tw-room2
      # SAME two-fact liveness test as the live entry, same flag, same code path.
      - --require-cmd
      - claude
      - --require-cmd
      - opencode
      - --require-cmd
      - codex
      - --budget-s
      - "600"
      - --
      # The twin's recovery is the SAME PROGRAM as the live entry's, pointed at a throwaway
      # session, package and seat. It used to be `tmux new-session`, and once the live entry
      # moved to recover-room.py the pair stopped being twins: a staged-failure probe would
      # have exercised a program the live entry no longer runs, and C3's room evidence would
      # have covered the twin's action instead of the live one. That is G-41 a level up —
      # a probe that is a DIFFERENT MECHANISM wearing the same name. Integrator's catch, #363.
      - /usr/bin/python3
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/jobs/recover-room.py
      - --session
      - tw-room2
      - --package
      - /home/henri/ht-wkdir/second-brain/.rbtv/goals/build-core-daemon-mvp/runs/run-1/seats/jobs-builder/throwaway/pkg-room
      - --seat
      - tw-recovery
      - --coord
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/team-kit/coord.py

  # ── task 7.72 (issues.md G-2) — watch-heartbeat freshness + relaunch ──────
  # LIVE target: the run's only sensor. A heartbeat is TWO facts — the timestamp AND that
  # its stated pid is a live watch.py (p-heartbeat-is-two-facts). Tolerance 3 matches
  # coord.watcher_heartbeat()'s three-missed-passes judgement, so the job and `coordinate workers`
  # never disagree about the same file. Refuses to double-start.
  selfheal-watch:
    argv:
      - /usr/bin/python3
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/jobs/selfheal-watch.py
      # ⚠ THIS ENTRY DELIBERATELY NAMES NO RUN — task 7.117, leader ruling on ask #204
      # (`issues.md` G-305/G-318). It used to pin one run's package explicitly, and that run had
      # CLOSED days earlier: a fire would have relaunched a sensor against a closed run's package
      # while the self-heal's own status kept reading healthy. That is the cadence lesson one field
      # over — a run number in an argv is a HOME IN WAITING, and it goes stale the moment that run
      # closes. ⚠ THIS COMMENT THEREFORE NAMES NO RUN EITHER, deliberately: a run number in prose
      # is a home in waiting too, and it drifts in silence because nothing consumes it.
      # Re-pinning it to the then-live run would have reproduced the defect at the very next close,
      # so the target is now RESOLVED rather than pinned: `--goal` names the GOAL, and
      # `selfheal-watch.py` asks `coord.resolve_live_run()` which run reads `state=open` in that
      # goal's runs.csv AT FIRE TIME. There is no value left here to go stale.
      # The resolver REFUSES on zero or two open rows rather than guessing (R9/R10), so an
      # ambiguous register produces a loud non-zero exit, never a silently wrong target.
      - --goal
      - /home/henri/ht-wkdir/second-brain/.rbtv/goals/build-core-daemon-mvp
      - --coord
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/team-kit/coord.py
      - --watch-py
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/team-kit/watch.py
      - --notify
      # ⚠ THIS ENTRY DELIBERATELY NAMES NO CADENCE VALUE — task 7.112, ruling `r-watch-loop-30s`.
      # It used to pass `--loop "10"`, and that is the FLOOR'S LESSON ONE FIELD OVER: a number in an
      # argv is a HOME IN WAITING. The cadence's normative home is the run's budget.json
      # (`cadence.watch_loop_max_seconds`); `selfheal-watch.py` now relaunches with a valueless
      # `--loop-forever` and `watch.py` reads the declaration. A recovery path holding no number
      # cannot resurrect a sensor at a cadence nobody ruled.
      # The relaunch must reproduce the sensor's OWN invocation, whatever that invocation is:
      # a self-heal that silently dropped a flag would resurrect a WEAKER sensor than the one
      # that died, and the run would never notice the downgrade (G-42).
      # ⚠ THIS COMMENT DELIBERATELY NAMES NO FLOOR VALUE. It used to quote one, and a number in
      # prose is a HOME IN WAITING — it drifts silently because nothing consumes it, and the
      # argument above never needed it. The floor's normative home is the run's budget.json.
      #
      # NOTIFY ROUTING — the G-42 argument above, fired for real (issue G-leader-0805-0120).
      # This entry carried NO --watch-arg at all, so the relaunch produced
      # `--package/--notify/--loop-forever` and nothing else. Both routing flags then fall to
      # watch.py's own `leader` default, and a flag whose SUBJECT is the leader has the leader as
      # its only recipient — the messaging layer refuses it, silently. That is not hypothetical:
      # 7 leader-subject flags died that way between 2026-07-30 and 08-03, and on 08-05 01:17:59
      # this job raced a manual restart and did relaunch a flag-less loop (caught by the
      # chief-of-staff, killed, disclosed). The comment above already stated the rule this argv
      # was breaking. These four items reproduce the live sensor's invocation, verified against
      # the running loop's /proc cmdline and the run seed's canonical command, which agree.
      # ⚠ ROLE NAMES, NOT A POLICY VALUE: `leader` and `chief-of-staff` are fixed seats of the run
      # system, present in every run — they are not a number, not a cadence, and not a floor, so
      # the home-in-waiting argument above does NOT apply to them. What WOULD be a home in waiting
      # is a run id or a pane, and neither appears here.
      # ⚠ THE `=` IS LOad-BEARING, NOT STYLE. `--watch-arg --notify-to` as two items makes argparse
      # read `--notify-to` as the NEXT FLAG, not as a value ("expected one argument"), and the job
      # would then die at parse time on every fire — a self-heal that cannot start is worse than the
      # silent-drop it was fixed to prevent. The split form was written here first and the dry-run
      # is what caught it. Any future passthrough of a dash-leading argument uses `=` too.
      - --watch-arg=--notify-to
      - --watch-arg=leader
      - --watch-arg=--notify-fallback
      - --watch-arg=chief-of-staff
      - --budget-s
      - "120"

  # THROWAWAY twin: a scratch package with its own heartbeat and its own watch.py.
  # No --notify: a throwaway watcher must never inject traffic into the live room.
  #
  # ⚠ THIS ENTRY KEEPS AN EXPLICIT `--package` AND MUST NEVER RESOLVE LIVE (task 7.117, leader
  # ruling (b) on ask #204). `--package` is the EXPLICIT OVERRIDE, so naming it here means this
  # entry never enters the resolving branch at all. That is the whole point: a THROWAWAY watcher
  # resolved onto the LIVE run would inject throwaway state into the live room, which this entry's
  # own `--notify` omission above exists to prevent and which C4 forbids outright.
  # THE CLOSED-RUN SEGMENT IN THE PATH BELOW IS DELIBERATE AND IS NOT A STALE PIN. It is a scratch
  # fixture inside a CLOSED run, and a closed run is the STABLE place for one precisely because
  # nothing rewrites closed-run history. Relocating it into the live run was considered and RULED
  # AGAINST: it buys nothing and puts throwaway state where C4 has to reason about it.
  # So the absence-of-run-numbers property is the LIVE entry's, not this one's.
  # ⚠ AND THIS ENTRY DELIBERATELY CARRIES NO `--goal` / `--coord`. Were they here, a later hand
  # dropping `--package` would leave a throwaway job silently resolving onto the LIVE run — the
  # exact C4 breach above. Without them it REFUSES with a non-zero exit instead. Fail closed.
  selfheal-watch-throwaway:
    argv:
      - /usr/bin/python3
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/jobs/selfheal-watch.py
      - --package
      - /home/henri/ht-wkdir/second-brain/.rbtv/goals/build-core-daemon-mvp/runs/run-1/seats/jobs-builder/throwaway/pkg-watch
      - --watch-py
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/team-kit/watch.py
      # The SAME passthrough as the live entry, and it is not cosmetic: the relaunch path is
      # only ever exercised by this twin (the live entry no-ops while the sensor is healthy),
      # so without these the staged-failure probe would run an argv that does not contain the
      # thing being proved. Integrator's catch, #303.
      # ⚠ SO THE CADENCE ARGV LEFT THIS ENTRY IN THE SAME ACT AS THE LIVE ONE (task 7.112). By the
      # argument directly above, moving only one would have left the probe proving an argv nobody
      # runs — the twin must keep matching the live entry, including in what it no longer carries.
      - --budget-s
      - "120"

  # ── task 7.32 (settle ledger R24/R32) — the goal-watcher-job ───────────────
  # STAGED DAEMON EXPOSURE (leader #628, integrator note — the only lines here NOT authored by
  # `enforcement-builder`): the LIVE `goal-watcher` entry is DELIBERATELY ABSENT. This job had
  # never executed under the daemon, so the twin below is applied FIRST and fired on a throwaway
  # package to prove the fire-tool path — argv, the daemon's exec environment, `jobcontain` —
  # before the live entry can ever fire. A by-hand shadow window exercises the PROGRAM and not
  # that path, so a green window alone would have retired a different risk. The live entry is
  # added only once this twin AND the shadow window are green. Block author: `enforcement-builder`;
  # applied verbatim by `spawn-integrator` (`p-profiles-integrator`).

  # THROWAWAY twin: the SAME PROGRAM with the SAME flags, pointed at a throwaway package.
  # It is the same program deliberately — once m1's live `selfheal-room` entry changed and its
  # twin did not, the pair stopped being twins and a staged-failure probe exercised a program
  # the live entry no longer ran (G-41, `p-clause3-not-met-despite-two-passes`). The ONLY
  # differences are the target package and `--to`, which points at a seat in the LIVE room so
  # delivery is genuinely exercised without a throwaway watcher injecting traffic anyone acts on.
  goal-watcher-throwaway:
    argv:
      - /usr/bin/python3
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/jobs/goal-watcher-job.py
      - --package
      - /home/henri/ht-wkdir/second-brain/.rbtv/goals/build-core-daemon-mvp/runs/run-1/seats/enforcement-builder/throwaway/pkg
      # The room flags are DELIVERED into is the live run; the package WATCHED is the throwaway.
      # Those are different things, and conflating them was a real defect this build's own probe
      # found: the recipient does not live in the room being watched.
      # ⚠ SO THE ROOM SIDE DELIBERATELY NAMES NO RUN — task 7.168 (design T9), on 7.167's
      # classification. It used to pin one run's package explicitly, and that run had CLOSED: the
      # comment directly above was TRUE when both were written in one commit 25 minutes before that
      # close, so the value went stale while the invariant did not. ⚠ THIS COMMENT THEREFORE NAMES
      # NO RUN EITHER, deliberately: a run number in prose is a home in waiting too, and it drifts
      # in silence because nothing consumes it. Swapping in the then-live run would reproduce the
      # defect at the very next close; naming the GOAL and asking runs.csv does not.
      # Same remedy and same shape as the live `selfheal-watch` and `selfheal-room` entries above —
      # resolved through coord.resolve_live_run (R10), which REFUSES rather than guesses on zero or
      # two open rows. ⚠ THE PACKAGE WATCHED, one field up, KEEPS ITS CLOSED-RUN FIXTURE PATH: that
      # one is ruled deliberate (7.117, leader ruling (b) on ask #204), and the two fields are in
      # different classes on purpose.
      - --room-goal
      - /home/henri/ht-wkdir/second-brain/.rbtv/goals/build-core-daemon-mvp
      - --coord
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/team-kit/coord.py
      - --team-monitor
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/orchestration/cli/team-monitor/team_monitor.py
      - --to
      - enforcement-builder
      - --fallback-to
      - leader
      - --standby
      - spawn-integrator
      - --cadence-s
      - "20"
      - --tolerance-mult
      - "3"
      - --load-per-core
      - "1.5"
      - --quiet-min
      - "30"
      - --notify
      - --budget-s
      - "120"

  # ── r-restart-daemon-job (owner, 2026-08-04) — the leader-triggerable restart ──
  # The daemon restart stops requiring an owner's hand. NO THROWAWAY TWIN, and the absence
  # is reasoned rather than forgotten (elicitation-brief O-3): there is no throwaway daemon
  # to restart, so a twin would either restart the LIVE daemon — a second live firing, not a
  # twin — or target a unit that does not exist, which probes nothing.
  #
  # ⚠ argv[0] is the ABSOLUTE interpreter + absolute script, never a bare command: a
  # tool-like exec inherits the systemd --user manager's PATH (runToolLikeExec passes
  # `envFile: null`), and that PATH does not contain ~/.local/bin.
  #
  # ⚠ LANDED IS NOT LIVE. This file is boot-read, so this entry reaches the daemon only
  # through a restart — today the owner's one arming restart, thereafter this job itself.
  restart-daemon:
    argv:
      - /usr/bin/python3
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/jobs/restart-daemon.py
      - --unit
      - rbtv-ignite
      # The script INVENTS no default for this — it is required there, supplied here.
      - --budget-s
      - "120"

  # ── G-221 (A) — the IN-DAEMON arm of the verification trigger ──────────────
  # Leader ruling #1373/#1400: A+B. B is the systemd timer (deploy/rbtv-probe-suite.timer).
  #
  # ⚠⚠ A IS DOGFOODING, NOT COVERAGE, and the distinction is the leader's bound, not a nicety:
  # this entry is the run adopting the feature it builds (conduct.md §1). It is NOT redundancy
  # for B, and B IS NEVER WEAKENED BECAUSE THIS EXISTS. A checker that lives inside the system
  # it checks SHARES ITS FAILURE MODE — if the daemon stops, this stops, and its silence looks
  # exactly like health. That is the whole ruling, and it was measured the same day: the two
  # selfheal jobs below were dead for 23 hours and nothing reported it (G-254).
  #
  # Same runner as B, deliberately — ONE implementation of "run the suite and say so on every
  # fire". The runner writes <workspace>/.rbtv/runtime/probe-suite/latest.json, so whichever arm
  # fired last is visible in one place with its own instant and staleness budget.
  #
  # ⚠ NO --watch-arg-style passthrough here and none is wanted: the runner takes no arguments,
  # so there is nothing for a twin to fail to mirror (G-243, where a throwaway twin carried a
  # flag the live entry did not and thereby proved an argv production never runs).
  probe-suite:
    argv:
      - /usr/bin/python3
      - /home/henri/ht-wkdir/second-brain/3-resources/tools/rbtv/ignite/deploy/probe-suite-scheduled.py
