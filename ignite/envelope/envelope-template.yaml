version: 1
families:
  - id: goal-folder
    number: 1
    access: rw
    plan-fill-in: false
    path: "{workspace}/.rbtv/goals/{goal}"
    except: daemon-owned-records
  - id: named-repos
    number: 2
    access: rw
    plan-fill-in: true
    include-git: true
    source: plan.namedRepos
  - id: project-folder
    number: 3
    access: rw
    plan-fill-in: true
    source: plan.projectFolder
  - id: scratch-temp
    number: 4
    access: rw
    plan-fill-in: false
    paths:
      - "{workspace}/.rbtv/goals/{goal}/scratch"
      - "{tmpdir}"
      - "/tmp"
  - id: vault-wide-read
    number: 5
    access: ro
    plan-fill-in: false
    path: "{workspace}"
    minus: deny-list
  # `rbtv-and-mirror` split in two (2026-08-30, owner ruling on `fix-mirror-family-split`):
  # a plan needing to write a product under `{mirror}` (e.g. `.rbtv/mirror/office/x`) had no
  # family to carve against — `authorizedCarve` only admitted an rw narrow inside a `vault-wide-read`
  # wide, and family 6 bound the rbtv SOURCE REPO and the mirror under one id, so keying a carve on
  # the family would have opened rw into the rbtv repo too. Splitting them let `mirror` take the
  # same carve exception as `vault-wide-read` while `rbtv-repo` kept none.
  # ⚠ THE SECOND HALF OF THAT SENTENCE NO LONGER HOLDS (2026-08-31, `ignite-engine-loop` M1,
  # register filing `G-leader-0828-1951`). The split left an open owner ask behind it — is the rbtv
  # read-only floor a GAP or a deliberate policy? — and the plan bound at 5dc32b91 settles it as a
  # GAP: `rbtv-repo` joins `compiler.js#CARVEABLE_RO_FAMILIES`, so a DECLARED rw narrow inside this
  # family now compiles, exactly as one under `mirror` or `vault-wide-read` does. Nothing declares
  # itself, so an UNDECLARED path in the repo is still covered `ro` by this family and still refuses
  # a write. The split therefore no longer carries the carve distinction it was created for; it is
  # left standing because it still names two roots, and collapsing it is a separate ruling.
  - id: rbtv-repo
    number: 6
    access: ro
    plan-fill-in: false
    path: "{rbtv-repo}"
  - id: benign-cache-config-temp
    number: 7
    access: rw
    plan-fill-in: false
    paths:
      - "{home}/.cache"
      - "{tmpdir}"
      - "/tmp"
      - "{home}/.config/*"
    exclude:
      - "{home}/.claude"
      - "{home}/.claude.json"
      - "{home}/.codex"
      - "{home}/.config/opencode"
  # ── THE ENDING STORE (2026-08-27) ────────────────────────────────────────────────────────────
  # `<workspace>/.rbtv/runtime/ignite/heart.db` is the ONE ending store, and spec-state-store §4.1
  # Row A makes the SEAT its own ending's author (`who_stamped: seat`). Family 5 binds `{workspace}`
  # READ-ONLY, so a caged seat's own `coordinate checkout` reached `stamp_seat_declare` and got
  # `attempt to write a readonly database` — the checkout REFUSED for every caged seat, measured
  # live on `scratch-tool-reach-note`/`plan-verifier` 2026-08-27 19:32Z. Same class as
  # `coordination` (8f299bc6): a protocol write surface the fence never opened.
  # THE DIRECTORY, NOT THE FILE: sqlite in WAL mode creates and unlinks `heart.db-wal` /
  # `heart.db-shm` beside the db and fsyncs the containing directory, so a file-level opening is
  # still a read-only database. `heart.db` sits directly in `.rbtv/runtime/ignite/` — there is no
  # dedicated store subfolder to open instead, so this is the narrowest opening that works.
  # ⚠ IT IS WIDER THAN THE DB. `asks/`, `leader-instructions/`, `outbox.json` and
  # `system-digest.json` are the daemon's own artifacts in that same directory and become writable
  # too. Under D3 that is accepted, not overlooked: record forgery is a stated NON-goal, and a
  # carve-back list for the four siblings would be a second list to keep in step with a directory
  # the daemon keeps adding to.
  - id: ending-store
    number: 8
    access: rw
    plan-fill-in: false
    path: "{workspace}/.rbtv/runtime/ignite"
  # THE MIRROR, its own family (2026-08-30). Was half of `rbtv-and-mirror` (family 6) — see that
  # family's comment above for why the split, and for why the split's own "and `rbtv-repo` keeps no
  # carve" half was reversed on 2026-08-31. `authorizedCarve` admits an rw narrow inside this
  # ro wide exactly as it does for `vault-wide-read`, so a plan's write grant (`projectFolder` /
  # `namedRepos` / `extraPaths:rw`) landing under `{mirror}` now compiles instead of refusing the
  # whole cage. The generic deny-list credential rules (`**/*.env`, `**/*token*`, `**/*.key`, …)
  # already run path-pattern-only against any `extraPaths` grant regardless of family, so a
  # credential file under the mirror is denied exactly as one anywhere else in the workspace —
  # nothing added here changes that.
  - id: mirror
    number: 9
    access: ro
    plan-fill-in: false
    path: "{mirror}"
